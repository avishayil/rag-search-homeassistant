name: Validate

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # This is a custom (non-default-store) integration installed by URL,
          # so it does not ship Home Assistant brand assets and is not listed in
          # the home-assistant/brands repository. The "license" check reads the
          # license GitHub reports for the default branch; the MIT LICENSE lives
          # in this repository but is only detected once it reaches the default
          # branch. Skip both action-only checks for a custom integration.
          ignore: brands license

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Run pytest
        run: pytest
